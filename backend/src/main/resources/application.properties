spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

server.port=${PORT:8080}
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://smooth-kingfish-2515.clerk.accounts.dev

# Resend Email Configuration (Loaded securely from Environment Variables)
RESEND_API_KEY=${RESEND_API_KEY}
RESEND_FROM_EMAIL=${RESEND_FROM_EMAIL:UniTracker <reminders@unitracker.live>}
